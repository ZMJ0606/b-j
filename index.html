<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<title>TOEIC 每日闯关 · 波&娇</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f5fa;--ink:#111827;--muted:#6b7280;--A:#3b6df6;--B:#f59e0b;--ok:#10b981;--bad:#ef4444;--line:#e8ecf4}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:40px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
/* 补丁2：iPhone 刘海安全区域 */
header{background:linear-gradient(135deg,#1e3a8a,#3b6df6);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:60}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px}
.roles{display:flex;gap:6px;background:rgba(255,255,255,.16);padding:4px;border-radius:12px}
.roles button{border:none;background:transparent;color:rgba(255,255,255,.75);font-weight:800;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:14px;font-family:inherit;min-height:38px}
.roles button.on{background:#fff;color:#1e3a8a}
.todaybar{display:flex;gap:14px;margin-top:10px;font-size:12px;opacity:.92;flex-wrap:wrap;align-items:center}
.todaybar b{font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:55;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;background:#f1f4fa;color:#4b5563;padding:8px 15px;border-radius:99px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;min-height:38px}
nav button.on{background:var(--A);color:#fff}
main{padding-top:14px}
.card{background:#fff;border-radius:16px;padding:17px;margin-bottom:13px;box-shadow:0 1px 3px rgba(16,24,40,.05),0 6px 20px -10px rgba(16,24,40,.1)}
h2{font-size:16.5px;margin:0 0 12px;font-weight:800}
h3{font-size:13px;margin:0 0 6px;font-weight:800;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.grid3{grid-template-columns:1fr 1fr}}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;background:#eef1f7;color:#374151;min-height:46px;display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--A);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.warn{background:#f59e0b;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:#4b5563}
.btn.block{width:100%;display:flex}

/* ===== 阶段卡片：统一浅色底 ===== */
.stage{display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;background:#f8faff;border:1.5px solid var(--line);margin-bottom:10px;cursor:pointer;min-height:66px}
.stage.done{background:#f8faff;border-color:#b7ecd6}
.stage.active{background:#fff;border-color:var(--line)}
.stage.locked{opacity:.55;cursor:not-allowed}
.stage .ic{font-size:22px;width:42px;height:42px;display:grid;place-items:center;background:#fff;border-radius:11px;flex:0 0 auto}
.stage .tx{flex:1;min-width:0}
.stage .tx b{font-size:14.5px;display:block}
.stage .tx span{font-size:12px;color:var(--muted)}
.stage .st{font-size:11px;font-weight:800;padding:4px 11px;border-radius:99px;background:#eef1f7;color:#6b7280;white-space:nowrap}
.stage.done .st{background:var(--ok);color:#fff}
.stage.active .st{background:var(--A);color:#fff}
.stage.done .ic{background:#fff}
.stage.done .st::before{content:'✓ '}

.pbar{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.bar{height:6px;background:#eef1f7;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b6df6,#7ba4ff);border-radius:99px;transition:.3s}
.stem{font-size:22px;font-weight:800;line-height:1.45;word-break:break-word;margin-bottom:4px;text-align:center}
.stem.long{font-size:16px;line-height:1.7;text-align:left}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px;text-align:center}
.sub.left{text-align:left}
.spk{border:none;background:#e8effe;color:var(--A);width:48px;height:48px;border-radius:50%;cursor:pointer;font-size:18px}
.spk.center{display:flex;margin:10px auto}
.opt{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin-bottom:9px;cursor:pointer;font-size:14.5px;min-height:50px}
.opt .k{flex:0 0 auto;width:24px;height:24px;border-radius:6px;background:#eef1f7;display:grid;place-items:center;font-size:12px;font-weight:800;color:#6b7280;margin-top:1px}
.opt.right{border-color:var(--ok);background:#e7f8f1}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt.wrong .k{background:var(--bad);color:#fff}
.explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fffaf0;border:1px solid #fde9c4;font-size:13.5px;color:#7c5a12;line-height:1.7}
.wcard{text-align:center;padding:16px 0}
.wcard .w{font-size:32px;font-weight:800;word-break:break-word}
.wcard .ph{color:var(--muted);font-size:14px;margin-top:4px;min-height:20px}
.wcard .cn{font-size:20px;font-weight:700;color:var(--A);margin-top:12px}
.wcard .ex{margin-top:14px;text-align:left;background:#f8faff;border-left:3px solid var(--A);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;color:#374151;line-height:1.6}
.blocks,.answer-area{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border-radius:12px;margin-bottom:14px}
.blocks{background:#f8faff;border:1.5px dashed #c9d7f8}
.answer-area{background:#fff;border:1.5px solid var(--A)}
.blocks .blk,.answer-area .blk{padding:9px 14px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
.blocks .blk{background:#fff;border:1.5px solid var(--line)}
.blocks .blk.used{opacity:.25;pointer-events:none}
.answer-area .blk{background:#e8effe;border:1.5px solid var(--A);color:var(--A)}
.answer-area .ph{color:#c3cad6;font-size:13px}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.cal-week span{text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{aspect-ratio:1;border-radius:11px;background:#f7f9fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:700;color:#4b5563;cursor:pointer;min-height:36px}
.cal-cell.out{opacity:.3;cursor:default}
.cal-cell.today{outline:2px solid var(--A);outline-offset:-2px}
.cal-cell.sel{background:#e8effe}
.cal-cell .dots{display:flex;gap:3px}
.cal-cell .dots i{width:6px;height:6px;border-radius:50%;background:#e2e7ef;display:block}
.cal-cell .dots i.a.on{background:var(--A)}
.cal-cell .dots i.b.on{background:var(--B)}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:800}
.badge.a{background:#e8effe;color:var(--A)}
.badge.b{background:#fef4e5;color:#b45309}
.stat-num{font-size:26px;font-weight:800;line-height:1.2}
.stat-lab{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.tip{background:#f0f6ff;border:1px solid #d6e4ff;border-radius:12px;padding:11px 13px;font-size:12.5px;color:#3b5bdb;line-height:1.7;margin-top:12px}
.result{text-align:center;padding:26px 18px}
.result .big{font-size:48px}
.result .pct{font-size:36px;font-weight:800;line-height:1.2;margin-top:4px}
.mini-stats{display:flex;justify-content:center;gap:18px;margin:16px 0;font-size:13px;flex-wrap:wrap}
.mini-stats b{display:block;font-size:20px;font-weight:800}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
/* 补丁1：输入框改为 16px，避免 iOS 放大页面 */
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:16px;outline:none;background:#fbfcfe;min-height:110px;resize:vertical;line-height:1.7}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:16px;outline:none;background:#fbfcfe}
#toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:rgba(17,24,39,.94);color:#fff;padding:12px 22px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:999;font-weight:700;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.combo-bar{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.06);z-index:70;opacity:0;transition:.3s;pointer-events:none}
.combo-bar.show{opacity:1}
.combo-bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b,#ef4444);border-radius:0 2px 2px 0;transition:width .3s,background .3s}
@keyframes avatarFlash{0%,100%{filter:none;transform:scale(1)}40%{filter:brightness(1.6) drop-shadow(0 0 12px #fbbf24);transform:scale(1.15)}}
.roles button.flash{animation:avatarFlash .5s ease}
#reportModal{position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.3s}
#reportModal.show{opacity:1;pointer-events:auto}
#reportModal .box{background:#fff;border-radius:22px;padding:26px 22px;max-width:420px;width:100%;text-align:center;transform:scale(.9);transition:.3s;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#reportModal.show .box{transform:scale(1)}
#reportModal .big{font-size:52px;line-height:1}
#reportModal h2{font-size:19px;margin:8px 0 4px}
#reportModal .mini-stats{justify-content:center;gap:14px;margin:16px 0}
#reportModal .quote{font-style:italic;font-size:13px;color:#6b7280;margin-top:8px;padding-top:10px;border-top:1px dashed #e5e7eb}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#3b6df6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:#fff;border-radius:22px;padding:30px 22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
#login h1{font-size:22px;margin:0 0 6px}
#login p{color:var(--muted);font-size:13px;margin:0 0 24px}
#login .players{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#login .player{border:2px solid var(--line);border-radius:18px;padding:16px 10px;cursor:pointer;transition:.18s;background:#fbfcfe}
#login .player:hover{border-color:var(--A);transform:translateY(-3px)}
#login .player.b:hover{border-color:var(--B)}
#login .player .av-line{width:90px;height:90px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:#f8faff;border-radius:50%;border:3px solid #e8effe;overflow:hidden}
#login .player.a .av-line{border-color:var(--A);background:#eef4ff}
#login .player.b .av-line{border-color:var(--B);background:#fff8ec}
#login .player .av-line svg{width:100%;height:100%;display:block}
#login .player .nm{font-weight:800;font-size:17px;margin-top:8px}
#login .player .sub{font-size:12px;color:var(--muted);margin-top:2px}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.mem-card{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:linear-gradient(135deg,#3b6df6,#7ba4ff);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;transition:.2s;font-size:13px;text-align:center;padding:6px;word-break:break-word;min-height:70px;color:transparent}
.mem-card.flipped{background:#fff;border-color:var(--A);color:var(--ink)}
.mem-card.matched{background:#e7f8f1;border-color:var(--ok);color:#0f9d6b;pointer-events:none}
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#e7f8f1;color:#0f9d6b}
.sync-badge.off{background:#f1f4fa;color:#9aa4b2}
.sync-badge i{width:6px;height:6px;border-radius:50%;background:#0f9d6b;display:block}
.sync-badge.off i{background:#9aa4b2}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.match-card{aspect-ratio:1.05;border-radius:10px;border:2px solid var(--line);background:linear-gradient(135deg,#3b6df6,#7ba4ff);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;transition:.2s;font-size:11.5px;text-align:center;padding:5px;word-break:break-word;min-height:62px;line-height:1.2;color:transparent}
.match-card.flipped{background:#fff;border-color:var(--A);color:var(--ink)}
.match-card.matched{background:#e7f8f1;border-color:var(--ok);color:#0f9d6b;pointer-events:none;opacity:.6}
.match-card.wrong{background:#fdecec;border-color:var(--bad);color:#dc2626}
@media(max-width:520px){.match-grid{gap:6px}.match-card{font-size:10.5px;min-height:54px}}
.fire-1{color:#fbbf24}
.fire-2{color:#f59e0b;font-weight:800}
.fire-3{color:#ea580c;font-weight:800}
.fire-4{color:#dc2626;font-weight:800;text-shadow:0 0 8px rgba(220,38,38,.3)}
.fire-icon{font-size:18px;line-height:1}
.fire-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#f8faff}
.fire-row.a{background:#eef4ff;border:1px solid #d5e2ff}
.fire-row.b{background:#fff8ec;border:1px solid #ffe1b8}
.fire-row .name{font-weight:800;font-size:13px;flex:0 0 auto}
.fire-row .days{font-weight:800;font-size:14px;color:#374151}
.fire-row .track{flex:1;height:8px;background:#e8ecf4;border-radius:99px;overflow:hidden}
.fire-row .track i{display:block;height:100%;border-radius:99px;transition:.5s}
.fire-row.a .track i{background:linear-gradient(90deg,#6f9bff,#3b6df6)}
.fire-row.b .track i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.fire-row .crown{font-size:16px;margin-left:2px}
.cal-cell{position:relative;overflow:hidden}
.cal-cell.done-a{background:#e8effe;border:1px solid #c9d8ff}
.cal-cell.done-b{background:#fef4e5;border:1px solid #ffd9a3}
.cal-cell.done-both{background:linear-gradient(135deg,#e8effe 0%,#fef4e5 100%);border:1px solid #d5c7ff;font-weight:800}
.cal-cell.today{animation:pulseToday 2.2s infinite}
@keyframes pulseToday{0%,100%{box-shadow:0 0 0 0 rgba(59,109,246,.55)}50%{box-shadow:0 0 0 8px rgba(59,109,246,0)}}
.cal-cell .day-emojis{display:flex;gap:1px;justify-content:center;font-size:12px;line-height:1;margin-top:1px;letter-spacing:-2px}
.cal-cell.sel{outline:2px solid var(--A);outline-offset:-2px}
.stage.theme-1{--tc:#3b6df6}
.stage.theme-2{--tc:#10b981}
.stage.theme-3{--tc:#8b5cf6}
.stage.theme-4{--tc:#f59e0b}
.stage.theme-5{--tc:#06b6d4}
.stage.theme-6{--tc:#ec4899}
.stage[class*="theme-"]{border-left:4px solid var(--tc);background:#f8faff}
.stage.done[class*="theme-"]{background:#f8faff}
.stage.active[class*="theme-"]{background:#fff;border-color:var(--line);border-left-color:var(--tc);box-shadow:0 4px 16px -6px rgba(0,0,0,.08)}
.progress-dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.progress-dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.22);display:block;transition:.3s}
.progress-dots i.on{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.85)}
.progress-dots i.now{background:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,.9);animation:pulseDot 1.6s infinite}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.wrong-card-hot{border:1.5px solid #fecaca;background:linear-gradient(135deg,#fef7f7,#fff);position:relative;overflow:hidden}
.wrong-badge-num{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 0 0 0 rgba(220,38,38,.6);animation:pulseBadge 2s infinite}
@keyframes pulseBadge{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
.wrong-card-clean{border:1.5px solid #b7ecd6;background:linear-gradient(135deg,#f0fdf4,#fff)}
.wrong-card-clean .em{font-size:28px}
.match-card-elevated{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;position:relative;overflow:hidden;border:none}
.match-card-elevated::before{content:'✨';position:absolute;right:14px;top:10px;font-size:16px;opacity:.7}
.match-card-elevated::after{content:'🎮';position:absolute;left:10px;bottom:6px;font-size:24px;opacity:.28}
.match-card-elevated .txt-b{color:#fff;font-weight:800;font-size:15px}
.match-card-elevated .txt-s{color:rgba(255,255,255,.85);font-size:12px}
.match-card-elevated .btn{background:rgba(255,255,255,.95);color:#5b21b6;font-weight:800}
.avatar-mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:#fff}
.avatar-mini.a{background:#e8effe;border:2px solid var(--A)}
.avatar-mini.b{background:#fef4e5;border:2px solid var(--B)}
.lead-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:#fef3c7;color:#b45309;margin-left:4px}
.crown-tag{font-size:16px;margin-left:4px}
.vs-block{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.vs-block:last-child{border-bottom:none}
.vs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:800}
.vs-head .icon{font-size:14px;margin-right:4px}
.vs-bar{display:flex;align-items:center;gap:6px}
.vs-left,.vs-right{flex:1;height:22px;background:#f2f5fa;border-radius:6px;overflow:hidden;position:relative}
.vs-left{display:flex;justify-content:flex-end}
.vs-left i,.vs-right i{display:block;height:100%;border-radius:6px;transition:.6s cubic-bezier(.2,.8,.2,1)}
.vs-left i{background:linear-gradient(90deg,#6f9bff,#3b6df6)}
.vs-right i{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.vs-left i.win{box-shadow:0 0 0 2px #fde68a inset}
.vs-right i.win{box-shadow:0 0 0 2px #fde68a inset}
.vs-mid{flex:0 0 auto;font-weight:900;color:var(--muted);font-size:12px;padding:0 4px}
.vs-val{position:absolute;top:0;line-height:22px;font-size:11px;font-weight:800;color:#fff;padding:0 6px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.vs-left .vs-val{left:6px}
.vs-right .vs-val{right:6px}
.vs-empty{color:#c3cad6;font-size:12px;font-weight:700;line-height:22px;padding:0 10px}
.vs-top-duel{background:linear-gradient(135deg,#1e3a8a,#3b6df6);color:#fff;border-radius:16px;padding:20px;text-align:center;position:relative;overflow:hidden;margin-bottom:13px}
.vs-top-duel::before{content:'';position:absolute;left:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.vs-top-duel::after{content:'';position:absolute;right:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}

function getMatchWordPool(){
  var R=cur(),d=todayStr();
  var pool=[];
  var srsToday=Object.keys(R.srs||{}).filter(function(k){return R.srs[k].last===d});
  srsToday.forEach(function(k){var w=DB.content.words.find(function(x){return x.id===k});if(w&&w.cn)pool.push(w)});
  var wrongList=getWrongList();
  wrongList.forEach(function(item){
    if(item.type==='fill'||item.type==='listening'){
      var s=DB.content.sentences.find(function(x){return x.id===item.id});
      if(s){DB.content.words.forEach(function(w){if(w.w&&s.en.toLowerCase().indexOf(w.w.toLowerCase())>=0&&w.cn)pool.push(w)})}
    }else if(item.type==='synonym'){
      var syn=DB.content.synonyms.find(function(x){return x.id===item.id});
      if(syn){var w=DB.content.words.find(function(x){return x.w===syn.w});if(w&&w.cn)pool.push(w)}
    }
  });
  var seen={},uniq=[];
  pool.forEach(function(w){if(!seen[w.id]){seen[w.id]=1;uniq.push(w)}});
  return uniq;
}
function startMatchGame(){
  var pool=getMatchWordPool();
  if(pool.length<10){
    var extra=shuffle(DB.content.words.filter(function(w){return w.cn&&w.w})).slice(0,50);
    pool=pool.concat(extra);
    var seen={},uniq=[];
    pool.forEach(function(w){if(!seen[w.id]){seen[w.id]=1;uniq.push(w)}});
    pool=uniq;
  }
  if(pool.length<10){toast('词库不足，无法开始');return}
  var allPairs=shuffle(pool).slice(0,Math.min(pool.length,50));
  var levels=[];
  for(var i=0;i<allPairs.length;i+=10){levels.push(allPairs.slice(i,i+10))}
  state.match={levels:levels,currentLevel:0,matchedPairs:[],flipped:[],lock:false,completed:false,cards:null,totalPairs:allPairs.length};
  render();
}
function renderMatch(main){
  var m=state.match;
  if(m.completed){
    main.innerHTML='<div class="card result"><div class="big">🎉</div><h2>消消乐通关！</h2><div class="muted">共消除 '+m.totalPairs+' 对单词</div><div class="muted" style="margin-top:6px">今天状态真好，明天见！</div></div><div class="card"><button class="btn primary block" id="againBtn">再来一轮</button><button class="btn ghost block" id="homeBtn" style="margin-top:9px">返回今日关卡</button></div>';
    $('#againBtn',main).onclick=function(){state.match=null;startMatchGame()};
    $('#homeBtn',main).onclick=function(){state.match=null;state.view='today';render()};
    return;
  }
  var level=m.levels[m.currentLevel];
  var totalLevels=m.levels.length;
  if(!m.cards){
    var raw=[];
    level.forEach(function(w,i){
      raw.push({pair:i,type:'en',text:w.w});
      raw.push({pair:i,type:'cn',text:w.cn});
    });
    m.cards=shuffle(raw);
  }
  var cards=m.cards;
  var html='<div class="card"><div class="row between"><div><div style="font-size:12px;color:#6b7280;font-weight:700">🎮 单词消消乐</div><div style="font-size:18px;font-weight:800;margin-top:2px">第 '+(m.currentLevel+1)+' / '+totalLevels+' 关</div></div><button class="btn ghost" id="quitMatch" style="padding:6px 12px;min-height:36px">退出</button></div>';
  html+='<div class="muted" style="margin-top:8px">已消除 '+m.matchedPairs.length+' / 10 对 · 点英文再点中文</div>';
  html+='<div class="bar" style="margin-top:10px"><i style="width:'+(m.matchedPairs.length/10*100).toFixed(1)+'%"></i></div>';
  html+='</div>';
  html+='<div class="card"><div class="match-grid" id="matchGrid">';
  cards.forEach(function(c,i){
    var isMatched=(m.matchedPairs.indexOf(c.pair)>=0);
    var isFlipped=(m.flipped.indexOf(i)>=0);
    var cls='match-card';
    if(isMatched)cls+=' matched';else if(isFlipped)cls+=' flipped';
    var display=(isMatched||isFlipped)?esc(c.text):'?';
    html+='<div class="'+cls+'" data-idx="'+i+'" data-pair="'+c.pair+'" data-type="'+c.type+'">'+display+'</div>';
  });
  html+='</div></div>';
  html+='<div class="card" style="text-align:center"><div class="muted" style="font-size:12px">全部消除后自动进入下一关</div></div>';
  main.innerHTML=html;
  $$('#matchGrid .match-card',main).forEach(function(el){
    el.onclick=function(){
      if(m.lock)return;
      var idx=+el.dataset.idx,pair=+el.dataset.pair;
      if(m.matchedPairs.indexOf(pair)>=0)return;
      if(m.flipped.indexOf(idx)>=0)return;
      m.flipped.push(idx);
      if(m.flipped.length===1){render();return}
      if(m.flipped.length===2){
        var a=cards[m.flipped[0]],b=cards[m.flipped[1]];
        if(a.pair===b.pair&&a.type!==b.type){
          m.matchedPairs.push(a.pair);m.flipped=[];
          if(m.matchedPairs.length>=10){
            m.currentLevel++;
            m.matchedPairs=[];
            m.flipped=[];
            m.cards=null;
            if(m.currentLevel>=m.levels.length){m.completed=true}
          }
          render();
        }else{
          m.lock=true;el.classList.add('wrong');render();
          setTimeout(function(){m.flipped=[];m.lock=false;render()},600);
        }
      }
    };
  });
  $('#quitMatch',main).onclick=function(){if(confirm('退出消消乐？进度不保存')){state.match=null;state.view='today';render()}};
}

function renderPKGame(main){var s=state.pk;if(s.phase==='finished')return renderPKResult(main);if(s.game==='memory')return renderPKMemory(main);return renderPKQuiz(main)}
function startPK(game){
  if(game==='memory'){startPKMemory();return}
  var pool=shuffle(DB.content.words).slice(0,50);if(pool.length<4){toast('词库至少需要4个单词');return}
  state.pk={game:game,name:{quiz:'单词抢答赛',cn2en:'中译英对决',listen:'听音抢答',syn:'同义词对决'}[game],words:pool,idx:0,scoreA:0,scoreB:0,phase:'playing',frozenA:false,frozenB:false,reveal:false,question:null};
  nextPKQuestion();render();
}
function nextPKQuestion(){
  var s=state.pk;if(s.idx>=s.words.length){s.phase='finished';return}
  var q;
  if(s.game==='quiz'){var w=s.words[s.idx];var wrongs=shuffle(DB.content.words.filter(function(x){return x.id!==w.id})).slice(0,3).map(function(x){return x.cn});while(wrongs.length<3)wrongs.push('other'+wrongs.length);var opts=shuffle([w.cn].concat(wrongs));q={stem:w.w,ph:w.ph||'',opts:opts,ans:opts.indexOf(w.cn),speak:w.w,listen:false}}
  else if(s.game==='cn2en'){var w2=s.words[s.idx];var wrongs2=shuffle(DB.content.words.filter(function(x){return x.id!==w2.id})).slice(0,3).map(function(x){return x.w});while(wrongs2.length<3)wrongs2.push('other'+wrongs2.length);var opts2=shuffle([w2.w].concat(wrongs2));q={stem:w2.cn,ph:'',opts:opts2,ans:opts2.indexOf(w2.w),speak:'',listen:false}}
  else if(s.game==='listen'){var w3=s.words[s.idx];var wrongs3=shuffle(DB.content.words.filter(function(x){return x.id!==w3.id})).slice(0,3).map(function(x){return x.w});while(wrongs3.length<3)wrongs3.push('other'+wrongs3.length);var opts3=shuffle([w3.w].concat(wrongs3));q={stem:'🔊',ph:'听音频选单词',opts:opts3,ans:opts3.indexOf(w3.w),speak:w3.w,listen:true};setTimeout(function(){speak(w3.w)},300)}
  else if(s.game==='syn'){var pool=DB.content.synonyms;if(!pool.length){toast('同义词库为空');state.pk=null;return}var syn=pool[s.idx%pool.length];var correct=syn.syns[0]||syn.cn;var wrongs4=[];pool.forEach(function(x){if(x.id!==syn.id)x.syns.forEach(function(v){if(v&&v!==correct&&syn.syns.indexOf(v)<0)wrongs4.push(v)})});wrongs4=shuffle(wrongs4.filter(function(v,i,arr){return arr.indexOf(v)===i})).slice(0,3);while(wrongs4.length<3)wrongs4.push('other'+wrongs4.length);var opts4=shuffle([correct].concat(wrongs4));q={stem:syn.w,ph:syn.ph,opts:opts4,ans:opts4.indexOf(correct),speak:syn.w,listen:false}}
  s.question=q;s.frozenA=false;s.frozenB=false;s.reveal=false;
}
function pkAnswer(player,i){
  var s=state.pk;if(s.reveal)return;if(player==='A'&&s.frozenA)return;if(player==='B'&&s.frozenB)return;
  var isCorrect=i===s.question.ans;
  if(isCorrect){if(player==='A')s.scoreA++;else s.scoreB++;s.reveal=true;setTimeout(function(){s.idx++;nextPKQuestion();render()},1400)}
  else{if(player==='A'){s.scoreA--;s.frozenA=true}else{s.scoreB--;s.frozenB=true}if(s.frozenA&&s.frozenB){s.reveal=true;setTimeout(function(){s.idx++;nextPKQuestion();render()},1400)}}
  render();
}
function renderPKQuiz(main){
  var s=state.pk,q=s.question;if(!q)return;
  var html='<div class="card" style="background:linear-gradient(135deg,#1e3a8a,#3b6df6);color:#fff;padding:14px 17px"><div class="row" style="justify-content:space-between;align-items:center"><div style="text-align:center;flex:1"><div style="font-size:11px;opacity:.85">'+NAMES.A+'</div><div style="font-size:32px;font-weight:800;line-height:1.1">'+s.scoreA+'</div></div><div style="text-align:center;flex:1.2"><div style="font-size:11px;opacity:.85">第 '+(s.idx+1)+' / '+s.words.length+'</div><div style="font-size:13px;opacity:.95;font-weight:700">🎮 '+s.name+'</div></div><div style="text-align:center;flex:1"><div style="font-size:11px;opacity:.85">'+NAMES.B+'</div><div style="font-size:32px;font-weight:800;line-height:1.1">'+s.scoreB+'</div></div></div></div>';
  html+='<div class="card" style="text-align:center;padding:22px 17px"><div style="font-size:11px;color:#6b7280;font-weight:700">抢答！选对 +1 分，选错 -1 分并冻结</div>';
  if(q.listen)html+='<button class="spk center" id="pkSpeak" style="width:64px;height:64px;font-size:26px;margin:14px auto">🔊</button>';
  else html+='<div style="font-size:'+(s.game==='cn2en'?'28px':'38px')+';font-weight:800;margin:14px 0 6px;word-break:break-word;color:'+(s.game==='cn2en'?'#3b6df6':'#111827')+'">'+esc(q.stem)+'</div>';
  if(q.ph&&!q.listen)html+='<div style="font-size:14px;color:#6b7280">'+esc(q.ph)+'</div>';
  if(s.reveal)html+='<div style="margin-top:14px;font-size:15px;color:#10b981;font-weight:700">✅ 正确答案：'+esc(q.opts[q.ans])+'</div>';
  html+='</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  html+=renderPKPlayer('A',q,s);html+=renderPKPlayer('B',q,s);
  html+='</div>';
  html+='<div class="card" style="padding:11px 17px"><button class="btn ghost block" id="pkQuit">退出游戏</button></div>';
  main.innerHTML=html;
  var spk=$('#pkSpeak',main);if(spk)spk.onclick=function(){speak(q.speak)};
  $$('[data-pk-player]',main).forEach(function(el){el.onclick=function(){pkAnswer(el.dataset.pkPlayer,+el.dataset.pkOpt)}});
  $('#pkQuit',main).onclick=function(){if(confirm('确定退出本局吗？')){state.pk=null;render()}};
}
function renderPKPlayer(player,q,s){
  var frozen=player==='A'?s.frozenA:s.frozenB;var color=player==='A'?'#3b6df6':'#f59e0b';var bg=player==='A'?'#e8effe':'#fef4e5';
  var html='<div style="background:'+bg+';border:2px solid '+color+';border-radius:14px;padding:12px">';
  html+='<div style="text-align:center;font-weight:800;color:'+color+';margin-bottom:10px;font-size:14px">'+NAMES[player]+(frozen?' ❄️':'')+'</div>';
  q.opts.forEach(function(o,i){var cls='opt';if(s.reveal&&i===q.ans)cls+=' right';var st='padding:10px 12px;font-size:13px;margin-bottom:7px;border-radius:10px;background:#fff';if(frozen)st+=';opacity:.4;pointer-events:none';html+='<div class="'+cls+'" data-pk-player="'+player+'" data-pk-opt="'+i+'" style="'+st+'"><div class="k" style="width:20px;height:20px;font-size:11px">'+'ABCD'[i]+'</div><div>'+esc(o)+'</div></div>'});
  html+='</div>';return html;
}
function renderPKResult(main){
  var s=state.pk;
  var total = s.words ? s.words.length : (s.cards ? s.cards.length/2 : 0);
  var unit = s.game==='memory' ? '对' : '题';
  var winner=s.scoreA>s.scoreB?NAMES.A:(s.scoreB>s.scoreA?NAMES.B:'平局');
  var emoji=s.scoreA>s.scoreB?'🏆':(s.scoreB>s.scoreA?'🏆':'🤝');
  var html='<div class="card result"><div class="big">'+emoji+'</div>';
  if(winner==='平局')html+='<h2 style="margin-top:8px">平局！</h2>';
  else html+='<h2 style="margin-top:8px">'+winner+' 获胜！</h2>';
  html+='<div class="mini-stats"><div><b style="color:#3b6df6">'+s.scoreA+'</b>'+NAMES.A+'</div><div><b style="color:#f59e0b">'+s.scoreB+'</b>'+NAMES.B+'</div></div>';
  html+='<div class="muted">共 '+total+' '+unit+' · '+s.name+'</div></div>';
  html+='<div class="card"><button class="btn primary block" id="pkAgain">再来一局</button><button class="btn ghost block" id="pkBack" style="margin-top:9px">返回游戏菜单</button><button class="btn ghost block" id="pkHome" style="margin-top:9px">返回今日关卡</button></div>';
  main.innerHTML=html;
  $('#pkAgain',main).onclick=function(){startPK(s.game)};
  $('#pkBack',main).onclick=function(){state.pk=null;render()};
  $('#pkHome',main).onclick=function(){state.pk=null;state.view='today';render()};
}
function startPKMemory(){
  var pool=shuffle(DB.content.words).slice(0,8);if(pool.length<8){toast('词库至少需要8个单词');return}
  var cards=[];pool.forEach(function(w,i){cards.push({pair:i,type:'en',text:w.w,matched:false,flipped:false});cards.push({pair:i,type:'cn',text:w.cn,matched:false,flipped:false})});
  cards=shuffle(cards);
  state.pk={game:'memory',name:'记忆翻牌',cards:cards,scoreA:0,scoreB:0,turn:'A',first:null,lock:false,phase:'playing'};
  render();
}
function renderPKMemory(main){
  var s=state.pk;var totalPairs=s.cards.length/2;var donePairs=s.cards.filter(function(c){return c.matched}).length/2;
  if(donePairs>=totalPairs){s.phase='finished';render();return}
  var html='<div class="card" style="background:linear-gradient(135deg,#1e3a8a,#3b6df6);color:#fff;padding:14px 17px"><div class="row" style="justify-content:space-between;align-items:center"><div style="text-align:center;flex:1"><div style="font-size:11px;opacity:.85">'+NAMES.A+'</div><div style="font-size:28px;font-weight:800">'+s.scoreA+'</div></div><div style="text-align:center;flex:1.2"><div style="font-size:11px;opacity:.85">已配对 '+donePairs+' / '+totalPairs+'</div><div style="font-size:13px;font-weight:700;margin-top:2px">🃏 记忆翻牌</div></div><div style="text-align:center;flex:1"><div style="font-size:11px;opacity:.85">'+NAMES.B+'</div><div style="font-size:28px;font-weight:800">'+s.scoreB+'</div></div></div></div>';
  html+='<div class="card"><div style="text-align:center;margin-bottom:12px;font-weight:800;color:'+(s.turn==='A'?'#3b6df6':'#f59e0b')+'">轮到 '+NAMES[s.turn]+' 翻牌</div>';
  html+='<div class="mem-grid">';
  s.cards.forEach(function(c,i){var cls='mem-card';if(c.matched)cls+=' matched';else if(c.flipped)cls+=' flipped';var display=(c.flipped||c.matched)?esc(c.text):'?';html+='<div class="'+cls+'" data-mem="'+i+'">'+display+'</div>'});
  html+='</div></div>';
  html+='<div class="card" style="padding:11px 17px"><button class="btn ghost block" id="memQuit">退出游戏</button></div>';
  main.innerHTML=html;
  $$('[data-mem]',main).forEach(function(el){el.onclick=function(){memFlip(+el.dataset.mem)}});
  $('#memQuit',main).onclick=function(){if(confirm('退出本局？')){state.pk=null;render()}};
}
function memFlip(i){
  var s=state.pk;if(s.lock)return;var c=s.cards[i];if(c.matched||c.flipped)return;
  c.flipped=true;
  if(s.first===null){s.first=i;render();return}
  var first=s.cards[s.first];
  if(first.pair===c.pair){first.matched=true;c.matched=true;if(s.turn==='A')s.scoreA++;else s.scoreB++;s.first=null;render()}
  else{s.lock=true;render();setTimeout(function(){first.flipped=false;c.flipped=false;s.first=null;s.lock=false;s.turn=s.turn==='A'?'B':'A';render()},1000)}
}

  html+='<div class="card"><button class="btn ghost block" id="backToPkMenu">返回游戏菜单</button></div>';
  main.innerHTML=html;
  $('#createRoom',main).onclick=function(){onlinePKHost()};
  $('#joinRoom',main).onclick=function(){var code=$('#roomInput',main).value.trim().toUpperCase();if(code.length!==6){toast('请输入 6 位房间码');return}onlinePKJoin(code)};
  $('#backToPkMenu',main).onclick=function(){state.onlinePK=null;render()};
}
function genRoomCode(){var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';var s='';for(var i=0;i<6;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
function mqttConnect(roomCode,onMessage,onConnected,onError){
  if(typeof mqtt==='undefined'){onError&&onError('MQTT库加载失败');return null}
  var clientId='toeic_'+Math.random().toString(16).slice(2,12);
  var topic=PK_TOPIC_PREFIX+roomCode;
  var client=mqtt.connect('wss://broker.emqx.io:8084/mqtt',{clientId:clientId,clean:true,connectTimeout:10000,reconnectPeriod:0});
  client.on('connect',function(){client.subscribe(topic,{qos:0},function(err){if(err){onError&&onError('订阅失败');return}onConnected&&onConnected()})});
  client.on('message',function(topic,payload){try{var msg=JSON.parse(payload.toString());onMessage&&onMessage(msg)}catch(e){}});
  client.on('error',function(err){onError&&onError('连接错误：'+(err.message||err))});
  return client;
}
function sendMsg(msg){var s=state.onlinePK;if(!s||!s.mqttClient)return;s.mqttClient.publish(PK_TOPIC_PREFIX+s.roomCode,JSON.stringify(msg),{qos:0})}
function onlinePKHost(){
  var s=state.onlinePK;var code=genRoomCode();s.roomCode=code;s.role='host';s.myPlayer='A';s.status='connecting';render();
  var client=mqttConnect(code,function(msg){onHostMessage(msg)},function(){s.status='waiting';render()},function(err){s.error=err;s.status='idle';toast(err);render()});
  s.mqttClient=client;
}
function onlinePKJoin(code){
  var s=state.onlinePK;s.roomCode=code;s.role='client';s.myPlayer='B';s.status='connecting';render();
  var client=mqttConnect(code,function(msg){onClientMessage(msg)},function(){sendMsg({type:'join',name:NAMES[DB.current]});s.status='waiting';render()},function(err){s.error=err;s.status='idle';toast(err);render()});
  s.mqttClient=client;
}
function onHostMessage(msg){
  var s=state.onlinePK;if(!s)return;
  if(msg.type==='join'){sendMsg({type:'welcome',name:NAMES[DB.current]});setTimeout(function(){startOnlineGame()},800);render()}
  else if(msg.type==='answer'){if(msg.idx!==s.idx||s.reveal)return;if(s.opponentAnswer===null)s.opponentAnswer=msg.choice;checkOnlineBothAnswered()}
}
function onClientMessage(msg){
  var s=state.onlinePK;if(!s)return;
  if(msg.type==='welcome'){
    render();
  }else if(msg.type==='start'){
    s.total=msg.total||0;
    if(!s.words||!s.words.length)s.words=new Array(s.total);
    s.status='playing';
    s.idx=0;s.scoreA=0;s.scoreB=0;
    render();
  }else if(msg.type==='question'){
    s.idx=msg.idx;
    s.total=s.total||msg.total||0;
    if(!s.words||!s.words.length)s.words=new Array(s.total||(msg.idx+1));
    s.currentQ={stem:msg.stem,ph:msg.ph||'',opts:msg.opts,ans:msg.ans,listen:msg.listen,speak:msg.speak};
    s.myAnswer=null;s.opponentAnswer=null;s.reveal=false;
    s.scoreA=msg.scoreA;s.scoreB=msg.scoreB;
    s.status='playing';
    if(msg.listen)setTimeout(function(){speak(msg.speak)},300);
    render();
  }else if(msg.type==='result'){
    s.reveal=true;s.scoreA=msg.scoreA;s.scoreB=msg.scoreB;render();
  }else if(msg.type==='finish'){
    s.scoreA=msg.scoreA;s.scoreB=msg.scoreB;s.status='finished';render();
  }
}
function startOnlineGame(){
  var s=state.onlinePK;var pool=shuffle(DB.content.words).slice(0,50);if(pool.length<4){toast('词库至少需要4个单词');return}
  s.words=pool;s.idx=0;s.scoreA=0;s.scoreB=0;s.total=pool.length;s.status='playing';
  sendMsg({type:'start',total:s.total});
  setTimeout(function(){sendNextOnlineQuestion()},500);
  render();
}
function sendNextOnlineQuestion(){
  var s=state.onlinePK;
  if(s.idx>=s.words.length){sendMsg({type:'finish',scoreA:s.scoreA,scoreB:s.scoreB});s.status='finished';render();return}
  var w=s.words[s.idx];var wrongs=shuffle(DB.content.words.filter(function(x){return x.id!==w.id})).slice(0,3).map(function(x){return x.cn});while(wrongs.length<3)wrongs.push('other'+wrongs.length);var opts=shuffle([w.cn].concat(wrongs));
  var q={stem:w.w,ph:w.ph||'',opts:opts,ans:opts.indexOf(w.cn),listen:false,speak:w.w};
  s.currentQ=q;s.myAnswer=null;s.opponentAnswer=null;s.reveal=false;
  sendMsg({type:'question',idx:s.idx,total:s.words.length,stem:q.stem,ph:q.ph,opts:q.opts,ans:q.ans,listen:false,speak:q.speak,scoreA:s.scoreA,scoreB:s.scoreB});
  render();
}
function onlineAnswer(player,choice){
  var s=state.onlinePK;if(!s||s.reveal)return;
  var isMe=(player===s.myPlayer);
  if(isMe){
    if(s.myAnswer!==null)return;
    s.myAnswer=choice;
  }else{
    if(s.opponentAnswer!==null)return;
    s.opponentAnswer=choice;
  }
  if(s.role==='client' && isMe){
    sendMsg({type:'answer',idx:s.idx,choice:choice});
  }
  checkOnlineBothAnswered();
  render();
}
function checkOnlineBothAnswered(){
  var s=state.onlinePK;if(s.role!=='host')return;if(s.myAnswer===null||s.opponentAnswer===null)return;
  var q=s.currentQ;var aRight=s.myAnswer===q.ans;var bRight=s.opponentAnswer===q.ans;
  if(aRight&&!bRight)s.scoreA++;else if(bRight&&!aRight)s.scoreB++;else if(aRight&&bRight){s.scoreA++;s.scoreB++}
  s.reveal=true;
  sendMsg({type:'result',idx:s.idx,correctIdx:q.ans,scoreA:s.scoreA,scoreB:s.scoreB});
  render();
  setTimeout(function(){s.idx++;if(s.idx>=s.words.length){sendMsg({type:'finish',scoreA:s.scoreA,scoreB:s.scoreB});s.status='finished';render();return}sendNextOnlineQuestion()},1800);
}
function renderOnlineConnecting(main){main.innerHTML='<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:48px">🌐</div><h2 style="margin-top:12px">正在连接服务器...</h2><div class="muted">房间码：<b style="font-size:20px;letter-spacing:3px;color:#3b6df6">'+state.onlinePK.roomCode+'</b></div></div>'}
function renderOnlineWaiting(main){
  var s=state.onlinePK;
  var html='<div class="card" style="text-align:center;padding:30px 20px"><div style="font-size:48px">🎮</div><h2 style="margin-top:12px">等待对手加入</h2><div style="margin:20px 0"><div class="muted" style="margin-bottom:8px">把房间码发给对方</div><div style="font-size:38px;font-weight:800;letter-spacing:8px;color:#10b981;background:#f0fdf4;padding:16px;border-radius:16px;border:2px dashed #10b981">'+s.roomCode+'</div></div><button class="btn ghost" id="copyCode" style="margin-bottom:12px">📋 复制房间码</button><div class="muted" style="margin-top:14px">对方打开网页 → 双人PK → 跨设备在线PK → 输入房间码</div></div>';
  html+='<div class="card"><button class="btn bad block" id="cancelOnline">取消</button></div>';
  main.innerHTML=html;
  $('#copyCode',main).onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(s.roomCode);toast('房间码已复制：'+s.roomCode)};
  $('#cancelOnline',main).onclick=function(){if(s.mqttClient)s.mqttClient.end();state.onlinePK=null;render()};
}
function renderOnlinePlaying(main){
  var s=state.onlinePK,q=s.currentQ;
  if(!q){main.innerHTML='<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:40px">⏳</div><div class="muted" style="margin-top:10px">准备中...</div></div>';return}
  var total=s.total||(s.words?s.words.length:0);
  var html='<div class="card" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:14px 17px"><div class="row" style="justify-content:space-between;align-items:center"><div style="text-align:center;flex:1"><div style="font-size:11px;opacity:.85">'+NAMES.A+'</div><div style="font-size:32px;font-weight:800;line-height:1.1">'+s.scoreA+'</div></div><div style="text-align:center;flex:1.3"><div style="font-size:11px;opacity:.85">房间 '+s.roomCode+'</div><div style="font-size:13px;opacity:.95;font-weight:700;margin-top:2px">第 '+(s.idx+1)+' / '+total+'</div></div><div style="text-align:center;flex:1"><div style="font-size:11px;opacity:.85">'+NAMES.B+'</div><div style="font-size:32px;font-weight:800;line-height:1.1">'+s.scoreB+'</div></div></div></div>';
  html+='<div class="card" style="text-align:center;padding:22px 17px"><div style="font-size:11px;color:#6b7280;font-weight:700">抢答！谁先选对谁得分</div><div style="font-size:36px;font-weight:800;margin:14px 0 6px;word-break:break-word">'+esc(q.stem)+'</div>';
  if(q.ph)html+='<div style="font-size:14px;color:#6b7280">'+esc(q.ph)+'</div>';
  if(s.reveal)html+='<div style="margin-top:14px;font-size:15px;color:#10b981;font-weight:700">✅ 正确答案：'+esc(q.opts[q.ans])+'</div>';
  html+='</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  html+=renderOnlinePlayerArea('A',q,s);html+=renderOnlinePlayerArea('B',q,s);
  html+='</div>';
  html+='<div class="card" style="padding:11px 17px"><button class="btn ghost block" id="onlineQuit">退出对战</button></div>';
  main.innerHTML=html;
  $$('[data-online-player]',main).forEach(function(el){el.onclick=function(){onlineAnswer(el.dataset.onlinePlayer,+el.dataset.onlineOpt)}});
  $('#onlineQuit',main).onclick=function(){if(confirm('退出对战？')){if(s.mqttClient)s.mqttClient.end();state.onlinePK=null;render()}};
}
function renderOnlinePlayerArea(player,q,s){
  var color=player==='A'?'#3b6df6':'#f59e0b';
  var bg=player==='A'?'#e8effe':'#fef4e5';
  var ans=(player===s.myPlayer)?s.myAnswer:s.opponentAnswer;
  var name=player==='A'?NAMES.A:NAMES.B;
  var isMe=(player===s.myPlayer);
  var html='<div style="background:'+bg+';border:2px solid '+color+';border-radius:14px;padding:12px">';
  html+='<div style="text-align:center;font-weight:800;color:'+color+';margin-bottom:10px;font-size:14px">'+name+(isMe?' 👈':'')+'</div>';
  q.opts.forEach(function(o,i){
    var cls='opt';
    if(s.reveal&&i===q.ans)cls+=' right';
    else if(s.reveal&&ans===i&&i!==q.ans)cls+=' wrong';
    var st='padding:10px 12px;font-size:13px;margin-bottom:7px;border-radius:10px;background:#fff';
    if(!isMe)st+=';pointer-events:none;opacity:.85';
    if(isMe&&ans!==null)st+=';pointer-events:none';
    if(s.reveal)st+=';pointer-events:none';
    html+='<div class="'+cls+'" data-online-player="'+player+'" data-online-opt="'+i+'" style="'+st+'"><div class="k" style="width:20px;height:20px;font-size:11px">'+'ABCD'[i]+'</div><div>'+esc(o)+'</div></div>';
  });
  html+='</div>';return html;
}
function renderOnlineFinished(main){
  var s=state.onlinePK;
  var total=s.total||(s.words?s.words.length:0);
  var winner=s.scoreA>s.scoreB?NAMES.A:(s.scoreB>s.scoreA?NAMES.B:'平局');var emoji=s.scoreA>s.scoreB?'🏆':(s.scoreB>s.scoreA?'🏆':'🤝');
  var html='<div class="card result"><div class="big">'+emoji+'</div>';
  if(winner==='平局')html+='<h2 style="margin-top:8px">平局！</h2>';else html+='<h2 style="margin-top:8px">'+winner+' 获胜！</h2>';
  html+='<div class="mini-stats"><div><b style="color:#3b6df6">'+s.scoreA+'</b>'+NAMES.A+'</div><div><b style="color:#f59e0b">'+s.scoreB+'</b>'+NAMES.B+'</div></div>';
  html+='<div class="muted">共 '+total+' 题 · 跨设备在线对战</div></div>';
  html+='<div class="card"><button class="btn primary block" id="pkAgain2">再来一局</button><button class="btn ghost block" id="pkBack2" style="margin-top:9px">返回游戏菜单</button></div>';
  main.innerHTML=html;
  $('#pkAgain2',main).onclick=function(){if(s.mqttClient)s.mqttClient.end();state.onlinePK=null;onlinePKInit()};
  $('#pkBack2',main).onclick=function(){if(s.mqttClient)s.mqttClient.end();state.onlinePK=null;render()};
}
$$('#roles button').forEach(function(b){b.onclick=function(){
  DB.current=b.dataset.r;save();
  state.session=null;state.pk=null;state.onlinePK=null;state.match=null;
  render();
  if(syncClient){try{syncClient.end()}catch(e){}syncClient=null}
  if(syncTimer){clearInterval(syncTimer);syncTimer=null}
  initSync();
}});
$$('#tabs button').forEach(function(b){b.onclick=function(){state.view=b.dataset.v;state.session=null;state.pk=null;state.onlinePK=null;state.match=null;render()}});
$$('#login .player').forEach(function(el){el.onclick=function(){DB.current=el.dataset.r;save();$('#login').style.display='none';render();initSync()}});

/* 战报关闭按钮 */
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='reportClose'){
    var el=$('#reportModal');if(el)el.classList.remove('show');
  }
},true);

/* ===== 启动：每次都显示登录页，让用户选角色 ===== */
loadDB();
render();
initSync();
</script>
